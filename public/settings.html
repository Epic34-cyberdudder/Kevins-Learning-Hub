<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Settings - Scramjet Site</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="settings.css" />
    <script src="theme.js"></script>
    <script src="cloak.js"></script>
  </head>
  <body>
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>

    <main class="settings-page">
      <div class="settings-header">
        <a href="/" class="bar-btn" title="Home" aria-label="Home">&#8962;</a>
        <h1>Settings</h1>
      </div>

      <div class="card settings-card">
        <div class="settings-section">
          <h2>Default Search Engine</h2>
          <div class="settings-options" id="engine-options">
            <button type="button" class="option-btn" data-engine="bing">Bing</button>
            <button type="button" class="option-btn" data-engine="google">Google</button>
          </div>
          <p class="settings-hint">
            Google sometimes shows its own verification challenge on proxied traffic.
          </p>
        </div>

        <div class="settings-section">
          <h2>Tab Cloak</h2>
          <div class="settings-options" id="cloak-options">
            <button type="button" class="option-btn" data-cloak="none">None</button>
            <button type="button" class="option-btn" data-cloak="google-docs">Google Docs</button>
            <button type="button" class="option-btn" data-cloak="kahoot">Kahoot!</button>
            <button type="button" class="option-btn" data-cloak="desmos">Desmos</button>
            <button type="button" class="option-btn" data-cloak="khan">Khan Academy</button>
            <button type="button" class="option-btn" data-cloak="classroom">Classroom</button>
            <button type="button" class="option-btn" data-cloak="canvas">Canvas</button>
          </div>
          <p class="settings-hint">Disguises the tab title and icon.</p>
        </div>

        <div class="settings-section">
          <h2>Panic Key</h2>
          <div class="settings-options" id="panic-key-options">
            <button type="button" class="option-btn" data-panickey="">Off</button>
            <button type="button" class="option-btn" data-panickey="Escape">Escape</button>
            <button type="button" class="option-btn" data-panickey="Backquote">` Backtick</button>
            <button type="button" class="option-btn" data-panickey="F1">F1</button>
          </div>
          <div class="settings-options" id="panic-action-options">
            <button type="button" class="option-btn" data-panicaction="overlay">Classroom Overlay</button>
            <button type="button" class="option-btn" data-panicaction="google">→ Google</button>
            <button type="button" class="option-btn" data-panicaction="classroom">→ Classroom</button>
            <button type="button" class="option-btn" data-panicaction="close">Close Tab</button>
          </div>
          <p class="settings-hint">Overlay covers screen with fake Classroom (GoGuardian safe). Press key again to hide.</p>
        </div>

        <div class="settings-section">
          <h2>Theme Color</h2>
          <div class="settings-swatches" id="theme-swatches">
            <button type="button" class="swatch" data-theme="purple" style="background:#7e22ce" aria-label="Purple"></button>
            <button type="button" class="swatch" data-theme="blue" style="background:#1d4ed8" aria-label="Blue"></button>
            <button type="button" class="swatch" data-theme="teal" style="background:#059669" aria-label="Teal"></button>
            <button type="button" class="swatch" data-theme="rose" style="background:#db2777" aria-label="Rose"></button>
            <button type="button" class="swatch" data-theme="amber" style="background:#d97706" aria-label="Amber"></button>
          </div>
        </div>
      </div>
    </main>

    <script src="settings.js" defer></script>
  </body>
</html>
